name: calc_bg_color
description: >-
  Makes user-uploaded logos readable on any background: removes solid
  background boxes, trims margins, detects color conflicts with your app
  background and recommends a better one. Pure Dart, no dependencies.
version: 0.1.0
repository: https://github.com/Hussein2077/calc-bg-color
issue_tracker: https://github.com/Hussein2077/calc-bg-color/issues
topics:
  - color
  - contrast
  - logo
  - image
  - accessibility

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

# Only the Flutter SDK. No third-party packages.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
